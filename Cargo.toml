[workspace]
resolver = "2"
members = [
  "crates/aegisflow-core",
  "crates/aegisflow-service",
  "crates/aegisflow-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nailuJ-dev/aegisflow"
authors = ["NailuJ-dev contributors"]
description = "Capability-secured workflow runtime for AI agents"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
