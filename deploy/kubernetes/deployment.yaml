apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisflow
  labels:
    app.kubernetes.io/name: aegisflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aegisflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegisflow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: ghcr.io/nailuj-dev/aegisflow:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_BIND
              value: 0.0.0.0:8080
            - name: APP_MAX_BODY_BYTES
              value: "1048576"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: aegisflow
spec:
  selector:
    app.kubernetes.io/name: aegisflow
  ports:
    - name: http
      port: 80
      targetPort: http
